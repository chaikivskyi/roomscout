framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            async_scraping:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: scraping
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            async_embeddings:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: embeddings
                retry_strategy:
                    max_retries: 5
                    delay: 30000
                    multiplier: 2
            async_matching:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: matching
                retry_strategy:
                    max_retries: 5
                    delay: 30000
                    multiplier: 2
            async_placements:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: placements
                retry_strategy:
                    max_retries: 3
                    delay: 30000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []
            command.bus: []
            query.bus: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                async_scraping: 'in-memory://'
                async_embeddings: 'in-memory://'
                async_matching: 'in-memory://'
                async_placements: 'in-memory://'
                failed: 'in-memory://'
