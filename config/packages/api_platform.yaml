api_platform:
    title: Home Decor API
    version: 1.0.0
    mapping:
        paths:
            - '%kernel.project_dir%/src/CatalogSearch/ApiResource'
            - '%kernel.project_dir%/src/Placement/ApiResource'
            - '%kernel.project_dir%/src/Project/ApiResource'
            - '%kernel.project_dir%/src/Identity/ApiResource'
            - '%kernel.project_dir%/src/Identity/Entity'
    exception_to_status:
        Symfony\Component\Serializer\Exception\ExceptionInterface: 400
        ApiPlatform\Metadata\Exception\InvalidArgumentException: 400
        Doctrine\ORM\OptimisticLockException: 409

        App\CatalogSearch\Exception\ContextStillProcessing: 202

        App\Api\Exception\UnauthorizedException: 401
        App\Api\Exception\NotFoundException: 404
        App\Api\Exception\AccessDeniedException: 403
        App\Api\Exception\ConflictException: 409
        App\Api\Exception\UnprocessableEntityException: 422

        App\Api\Exception\DomainExceptionInterface: 422

    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
        swagger_ui_extra_configuration:
            # Keep the endpoint list navigable as it grows: groups collapsed,
            # searchable, and deterministically ordered.
            docExpansion: 'none'
            filter: true
            tagsSorter: 'alpha'
            operationsSorter: 'alpha'
