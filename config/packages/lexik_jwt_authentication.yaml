lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # Documents the login endpoint in the API Platform OpenAPI spec.
    api_platform:
        check_path: /api/login
        username_path: email
        password_path: password
    # Enables server-side revocation: logout stores the token's jti in the cache
    # and blocked tokens are rejected until they expire.
    blocklist_token:
        enabled: true
        cache: cache.app
