framework:
    http_client:
        scoped_clients:
            cohere.client:
                base_uri: 'https://api.cohere.com'
                auth_bearer: '%env(COHERE_API_KEY)%'
            gemini.client:
                base_uri: 'https://generativelanguage.googleapis.com'
                headers:
                    x-goog-api-key: '%env(GEMINI_API_KEY)%'
            scraper.client:
                scope: '.*'
                timeout: 10
                max_duration: 30
                max_redirects: 5
