doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            vector: Pgvector\Doctrine\VectorType
        mapping_types:
            vector: vector
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Entity'
                prefix: 'App\Catalog\Entity'
                alias: Catalog
            CatalogScraper:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/CatalogScraper/Entity'
                prefix: 'App\CatalogScraper\Entity'
                alias: CatalogScraper
            Project:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Project/Entity'
                prefix: 'App\Project\Entity'
                alias: Project
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Entity'
                prefix: 'App\Identity\Entity'
                alias: Identity
            CatalogSearch:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/CatalogSearch/Entity'
                prefix: 'App\CatalogSearch\Entity'
                alias: CatalogSearch
            Placement:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Placement/Entity'
                prefix: 'App\Placement\Entity'
                alias: Placement

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
