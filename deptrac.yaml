deptrac:
  paths:
    - src

  layers:
    - name: Api
      collectors:
        - type: directory
          value: src/Api/.*
    - name: Catalog
      collectors:
        - type: directory
          value: src/Catalog/.*
    - name: CatalogScraper
      collectors:
        - type: directory
          value: src/CatalogScraper/.*
    - name: CatalogSearch
      collectors:
        - type: directory
          value: src/CatalogSearch/.*
    - name: Identity
      collectors:
        - type: directory
          value: src/Identity/.*
    - name: Placement
      collectors:
        - type: directory
          value: src/Placement/.*
    - name: Project
      collectors:
        - type: directory
          value: src/Project/.*
    - name: Admin
      collectors:
        - type: directory
          value: src/Admin/.*

  # Allowed dependencies between modules. Anything not listed here
  # (a new edge or a cycle) fails the analysis.
  ruleset:
    Api: ~
    Catalog: ~
    CatalogScraper:
      - Api
      - Catalog
    CatalogSearch:
      - Api
      - Catalog
      - Project
    Identity:
      - Api
    Placement:
      - Api
      - Catalog
      - CatalogSearch
      - Project
    Project:
      - Api
      - Identity
    Admin:
      - Catalog
      - CatalogScraper
      - Identity
